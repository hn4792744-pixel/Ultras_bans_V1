# -----------------------------------------------------------------------------
# ULTRAS_bans_v1 - Database configuration
# -----------------------------------------------------------------------------
# type: SQLITE (default, zero setup, single-server friendly) or MYSQL
#       (recommended for a proxy network so every backend server shares one
#       punishment database - see README "Proxy Setup").
# -----------------------------------------------------------------------------

type: SQLITE

sqlite:
  file: ultrasbans.db

mysql:
  host: localhost
  port: 3306
  database: ultrasbans
  username: root
  password: ""
  use-ssl: false
  pool-size: 8

# Prefix applied to every table this plugin creates. Change only before first
# startup on a shared database to avoid colliding with another plugin/instance.
table-prefix: "ultras_"
