# =============================================================================
# Custom command permissions (spec sections 22-23)
# =============================================================================
# Every entry is a "command" that can be toggled per player (/admin permissions <player>)
# or per rank (/admin permissions ranks). Toggles are stored in the database and applied
# through permission attachments, so they work WITHOUT relying on OP or a permissions plugin.
# Precedence: per-player override > rank setting > normal server permissions.
#
#   node:        the real permission node granted/denied
#   material:    icon in the permissions GUI
#   description: shown in the GUI lore
commands:
  ban:        { node: ultrasbans.ban,         material: IRON_AXE,       description: "Ban / unban players" }
  ipban:      { node: ultrasbans.ipban,       material: TNT,            description: "IP ban / un-IP-ban" }
  mute:       { node: ultrasbans.mute,        material: PAPER,          description: "Mute / unmute" }
  warn:       { node: ultrasbans.warn,        material: YELLOW_DYE,     description: "Warnings" }
  kick:       { node: ultrasbans.kick,        material: LEATHER_BOOTS,  description: "Kick players" }
  freeze:     { node: ultrasbans.freeze,      material: BLUE_ICE,       description: "Freeze / unfreeze" }
  jail:       { node: ultrasbans.jail,        material: IRON_BARS,      description: "Jail / unjail / jail settings" }
  setjail:    { node: ultrasbans.jail.set,    material: CHAIN,          description: "Set jail locations" }
  vanish:     { node: ultrasbans.vanish,      material: GLASS,          description: "Vanish" }
  vanish_see: { node: ultrasbans.vanish.see,  material: ENDER_EYE,      description: "See vanished players" }
  teleport:   { node: ultrasbans.teleport,    material: ENDER_PEARL,    description: "/tp and /tphere" }
  tp_all:     { node: ultrasbans.teleport.all, material: ENDER_EYE,     description: "/tp all and /tphere all" }
  gamemode:   { node: ultrasbans.gamemode,    material: GRASS_BLOCK,    description: "Gamemode commands" }
  logs:       { node: ultrasbans.logs,        material: BOOK,           description: "Logs and IP lookup" }
  permissions: { node: ultrasbans.permissions, material: COMMAND_BLOCK, description: "Manage command permissions" }
  admin:      { node: ultrasbans.admin,       material: NETHER_STAR,    description: "/admin, /tam and main GUIs" }
  reload:     { node: ultrasbans.reload,      material: REDSTONE,       description: "Reload configuration" }

# Ranks shown in /admin permissions ranks. A player's rank comes from the permission
# ultrasbans.rank.<name> (granted by your permissions plugin), otherwise "op" for operators
# and "default" for everyone else. Ranks that have stored settings are listed automatically.
ranks:
  - default
  - vip
  - helper
  - moderator
  - admin
  - owner
