name: Build ULTRAS BANS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Plugin
        run: cd ULTRAS_bans_v1 \run: mvn clean package -DskipTests\run: mvn clean package -DskipTests mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ULTRAS-BANS-JAR
          path: ULTRAS_bans_v1/target/*.jar
          if-no-files-found: error
