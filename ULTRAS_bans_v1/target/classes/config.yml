# =============================================================================
# ULTRAS_bans_v1 - Main Configuration
# =============================================================================
# This file only holds top-level switches. Everything else lives in its own
# file so no single config becomes unmanageable (spec section 47):
#   database.yml    -> database.yml
#   security.yml    -> mass-punishment protection
#   punishment.yml  -> durations, default reasons, broadcast behavior
#   proxy.yml       -> cross-server sync
#   commands.yml    -> per-command enable/disable
#   discord/*.yml   -> Discord integration
#   lang/<code>/*.yml -> all player-facing messages
#   gui/*.yml       -> every GUI's layout
# =============================================================================

language: en

server-name: "ULTRAS"

# The server identifier this instance reports as in punishment records, GUIs
# and Discord embeds. On a proxy network, give every backend server a unique
# id here (e.g. "survival-1", "lobby").
server-id: "server-1"

features:
  proxy-sync: false
  geyser-support: true
  discord-integration: false
  security-system: true
  vanish-hide-from-tab: true
  auto-vanish-on-teleport: false

links:
  discord: "https://discord.gg/ucx"

defaults:
  max-temporary-duration-days: 30
  broadcast-punishments-to-staff: true
  op-protection: true
  # Allow '/tp all' and '/tphere all' (still requires ultrasbans.teleport.all)
  teleport-all-enabled: true

# See commands.yml for disabling individual commands network-wide.
