# =============================================================================
# Mass-Punishment Protection (spec section 45)
# =============================================================================
# Detects a staff member (or compromised/malicious staff account) issuing an
# abnormal burst of punishments and reacts automatically. Every number below
# is configurable - nothing is hardcoded in the plugin.

enabled: true

# actions: how many punishments of that type within window (seconds) trigger detection.
thresholds:
  kick:   { actions: 5, window: 20 }
  ban:    { actions: 5, window: 20 }
  ipban:  { actions: 5, window: 20 }
  mute:   { actions: 8, window: 20 }
  jail:   { actions: 5, window: 20 }
  freeze: { actions: 8, window: 20 }

# Always performed the moment a threshold is exceeded.
on-detection:
  alert-staff: true
  discord-alert: true
  log-security-event: true

# If the SAME staff member trips detection this many times (across any action
# type) within escalation-window-minutes, the lockdown response below fires.
escalation:
  repeat-violations-before-lockdown: 3
  escalation-window-minutes: 30
  lockdown:
    remove-op: true
    remove-plugin-permissions: true
    remove-configured-rank: true
    set-default-rank: true
    lock-account: true
    notify-administrators: true

# Rank assigned by "set-default-rank" above.
default-rank: "default"
