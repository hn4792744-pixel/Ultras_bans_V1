name: ULTRAS_bans_v1
version: '1.0.0'
main: com.ultras.bans.UltrasBansPlugin
api-version: '1.21'
author: ULTRAS
description: Production-ready punishment and administration system for the ULTRAS network.
folia-supported: false
load: POSTWORLD

# -----------------------------------------------------------------------------
# Commands are intentionally claimed here so no other plugin can register the
# same label. UltrasCommandGuard (listener/CommandConflictGuard.java) also
# intercepts these labels at LOWEST priority on PlayerCommandPreprocessEvent /
# ServerCommandEvent as a second line of defense against plugins that call
# commands programmatically instead of through Bukkit's command map.
# Any command listed in commands.yml -> disabled-commands is still registered
# here (Bukkit requires that) but CommandDisableService makes it behave as if
# unknown to anyone without ultrasbans.bypass.disabled.
# -----------------------------------------------------------------------------
commands:
  ban:
    description: Ban a player permanently or temporarily.
    usage: /ban [player] [time] [reason]
    permission: ultrasbans.ban
  tempban:
    description: Alias entry point for temporary bans.
    usage: /tempban <player> <time> [reason]
    permission: ultrasbans.ban
  unban:
    description: Remove an active ban from a player.
    usage: /unban <player>
    permission: ultrasbans.ban
  ipban:
    description: IP-ban a player or raw IP address.
    usage: /ipban [player|ip] [time] [reason]
    permission: ultrasbans.ipban
    aliases: [ip_ban]
  unipban:
    description: Remove an active IP ban.
    usage: /unipban <player|ip>
    permission: ultrasbans.ipban
    aliases: [un_ip_ban]
  mute:
    description: Mute a player permanently or temporarily.
    usage: /mute [player] [time] [reason]
    permission: ultrasbans.mute
  unmute:
    description: Remove an active mute from a player.
    usage: /unmute <player>
    permission: ultrasbans.mute
  warn:
    description: Issue a warning to a player.
    usage: /warn [player] [reason]
    permission: ultrasbans.warn
  kick:
    description: Kick a player from the server.
    usage: /kick [player] [reason]
    permission: ultrasbans.kick
  freeze:
    description: Freeze a player in place.
    usage: /freeze [player]
    permission: ultrasbans.freeze
    aliases: [frz]
  unfreeze:
    description: Release a player from freeze.
    usage: /unfreeze <player>
    permission: ultrasbans.freeze
    aliases: [unfrz]
  setjail:
    description: Set the jail location at your current position.
    usage: /setjail <name>
    permission: ultrasbans.jail.set
  jail:
    description: Jail a player, or manage jail settings.
    usage: /jail [player|setting|list|logs]
    permission: ultrasbans.jail
  unjail:
    description: Release a player from jail.
    usage: /unjail <player>
    permission: ultrasbans.jail
  vanish:
    description: Toggle vanish for yourself or another player.
    usage: /vanish [player]
    permission: ultrasbans.vanish
    aliases: [vn, nv]
  admin:
    description: Open the central admin GUI.
    usage: /admin [permissions]
    permission: ultrasbans.admin
  game0:
    description: Set survival gamemode.
    usage: /game0 [player]
    permission: ultrasbans.gamemode
  game1:
    description: Set creative gamemode.
    usage: /game1 [player]
    permission: ultrasbans.gamemode
  game2:
    description: Set adventure gamemode.
    usage: /game2 [player]
    permission: ultrasbans.gamemode
  game3:
    description: Set spectator gamemode.
    usage: /game3 [player]
    permission: ultrasbans.gamemode
  games:
    description: Open the gamemode selector GUI.
    usage: /games [player]
    permission: ultrasbans.gamemode
  tp:
    description: Teleport to a player.
    usage: /tp [player|all]
    permission: ultrasbans.teleport
  tphere:
    description: Bring a player to you.
    usage: /tphere [player|all]
    permission: ultrasbans.teleport
  ip_list:
    description: Look up a player's stored IP and session information.
    usage: /ip_list <player>
    permission: ultrasbans.logs
  tam:
    description: Central administrative action command.
    usage: /tam <action> ...
    permission: ultrasbans.admin
  ultrasbans:
    description: Core plugin management command.
    usage: /ultrasbans <reload|version>
    aliases: [ub]

permissions:
  ultrasbans.*:
    description: Grants every ULTRAS_bans_v1 permission.
    default: op
    children:
      ultrasbans.admin: true
      ultrasbans.ban: true
      ultrasbans.ipban: true
      ultrasbans.mute: true
      ultrasbans.warn: true
      ultrasbans.kick: true
      ultrasbans.freeze: true
      ultrasbans.jail: true
      ultrasbans.jail.set: true
      ultrasbans.vanish: true
      ultrasbans.vanish.see: true
      ultrasbans.teleport: true
      ultrasbans.teleport.all: true
      ultrasbans.gamemode: true
      ultrasbans.logs: true
      ultrasbans.permissions: true
      ultrasbans.reload: true
      ultrasbans.bypass.freeze: true
      ultrasbans.bypass.jail: true
      ultrasbans.bypass.disabled: true
      ultrasbans.bypass.op-protect: true
      ultrasbans.security.exempt: true
  ultrasbans.admin:
    description: Access to /admin, /tam and the main GUIs.
    default: op
  ultrasbans.ban:
    description: Ban and unban players.
    default: op
  ultrasbans.ipban:
    description: IP-ban and un-IP-ban players.
    default: op
  ultrasbans.mute:
    description: Mute and unmute players.
    default: op
  ultrasbans.warn:
    description: Warn players and manage warnings.
    default: op
  ultrasbans.kick:
    description: Kick players.
    default: op
  ultrasbans.freeze:
    description: Freeze and unfreeze players.
    default: op
  ultrasbans.jail:
    description: Jail and unjail players.
    default: op
  ultrasbans.jail.set:
    description: Set jail locations.
    default: op
  ultrasbans.vanish:
    description: Toggle your own vanish state.
    default: op
  ultrasbans.vanish.see:
    description: See vanished players.
    default: op
  ultrasbans.teleport:
    description: Teleport administration.
    default: op
  ultrasbans.teleport.all:
    description: Use /tp all and /tphere all.
    default: op
  ultrasbans.gamemode:
    description: Change gamemode of self or others.
    default: op
  ultrasbans.logs:
    description: View punishment/IP logs.
    default: op
  ultrasbans.permissions:
    description: Manage per-player and per-rank command permissions.
    default: op
  ultrasbans.reload:
    description: Reload plugin configuration.
    default: op
  ultrasbans.bypass.freeze:
    description: Cannot be frozen.
    default: false
  ultrasbans.bypass.jail:
    description: Cannot be jailed.
    default: false
  ultrasbans.bypass.disabled:
    description: Can still use commands disabled via commands.yml.
    default: false
  ultrasbans.bypass.op-protect:
    description: Can punish OPs even when protect-op is enabled.
    default: false
  ultrasbans.security.exempt:
    description: Exempt from mass-punishment security detection.
    default: false
